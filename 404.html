<!DOCTYPE html>
<!--
================================================================================
  PÁGINA 404 — exibida quando um endereço não existe (configurada no .htaccess
  via "ErrorDocument 404 /404.html").
  Usa o mesmo style.css do index; os estilos exclusivos desta página ficam na
  seção "12. PÁGINA 404" do style.css.
  EDITAR: nome do negócio e número do WhatsApp (mesmos do index.html).
================================================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Luz Interior Terapias</title> <!-- EDITAR -->
  <!-- Página de erro não deve ser indexada pelos buscadores -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1b1433">

  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Caminho ABSOLUTO (/assets/...): necessário porque o servidor pode exibir
       esta página em qualquer URL, ex.: /pasta/inexistente/pagina -->
  <link rel="stylesheet" href="/assets/css/style.css" id="css-principal">
  <script>
    // Ao abrir o arquivo direto no computador (file://), caminhos absolutos
    // não funcionam. Nesse caso, troca para caminho relativo — só para pré-visualização.
    if (location.protocol === 'file:') {
      document.getElementById('css-principal').href = 'assets/css/style.css';
    }
  </script>
</head>

<body class="page-404">
  <!-- Cabeçalho simplificado: apenas a marca, que leva de volta ao início -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand" aria-label="Luz Interior Terapias — voltar ao início">
        <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 12c5 7 7 14 0 26-7-12-5-19 0-26z" />
          <path d="M32 38c-4-9-11-15-20-16 1 9 8 16 20 16z" />
          <path d="M32 38c4-9 11-15 20-16-1 9-8 16-20 16z" />
          <path d="M10 42c7 4 15 5 22 4 7 1 15 0 22-4" fill="none" stroke-width="2.5" stroke-linecap="round" />
        </svg>
        <span class="brand-name">Luz Interior <small>Terapias</small></span> <!-- EDITAR -->
      </a>
    </div>
  </header>

  <main class="hero error-hero" aria-labelledby="erro-titulo">
    <!-- Mesmos elementos decorativos do topo do index -->
    <div class="hero-stars" aria-hidden="true"></div>
    <svg class="hero-mandala" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="0.6">
        <circle cx="100" cy="100" r="96" />
        <circle cx="100" cy="100" r="72" />
        <circle cx="100" cy="100" r="48" />
        <circle cx="100" cy="100" r="24" />
        <ellipse cx="100" cy="52" rx="14" ry="48" />
        <ellipse cx="100" cy="52" rx="14" ry="48" transform="rotate(45 100 100)" />
        <ellipse cx="100" cy="52" rx="14" ry="48" transform="rotate(90 100 100)" />
        <ellipse cx="100" cy="52" rx="14" ry="48" transform="rotate(135 100 100)" />
        <ellipse cx="100" cy="52" rx="14" ry="48" transform="rotate(180 100 100)" />
        <ellipse cx="100" cy="52" rx="14" ry="48" transform="rotate(225 100 100)" />
        <ellipse cx="100" cy="52" rx="14" ry="48" transform="rotate(270 100 100)" />
        <ellipse cx="100" cy="52" rx="14" ry="48" transform="rotate(315 100 100)" />
      </g>
    </svg>

    <div class="container hero-content">
      <!-- "404" com uma flor de lótus no lugar do zero -->
      <p class="error-code" aria-label="Erro 404">
        <span aria-hidden="true">4</span>
        <svg class="error-lotus" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="none" stroke-width="1.2" />
          <path d="M32 14c4.5 6 6 12 0 22-6-10-4.5-16 0-22z" />
          <path d="M32 36c-3.5-8-9.5-13-17-14 1 8 7 14 17 14z" />
          <path d="M32 36c3.5-8 9.5-13 17-14-1 8-7 14-17 14z" />
          <path d="M14 42c6 3.5 12 4.5 18 3.5 6 1 12 0 18-3.5" fill="none" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <span aria-hidden="true">4</span>
      </p>

      <h1 id="erro-titulo">Este caminho <span>não foi encontrado</span></h1>
      <p class="hero-lead">
        A página que você procura não existe ou mudou de lugar.
        Respire fundo e siga por um dos caminhos abaixo.
      </p>

      <div class="hero-actions">
        <a href="/" class="btn">Voltar ao início</a>
        <!-- EDITAR: número do WhatsApp -->
        <a class="btn btn-ghost"
           href="https://wa.me/5511900000000?text=Ol%C3%A1!%20Vim%20pelo%20site%20e%20gostaria%20de%20agendar%20uma%20sess%C3%A3o."
           target="_blank" rel="noopener">Falar no WhatsApp</a>
      </div>

      <!-- Atalhos para as seções da página principal -->
      <nav class="error-links" aria-label="Atalhos do site">
        <a href="/#sobre">A Terapia</a>
        <a href="/#tecnicas">Técnicas</a>
        <a href="/#faq">Dúvidas</a>
        <a href="/#contato">Contato</a>
      </nav>
    </div>
  </main>

  <footer class="site-footer error-footer">
    <div class="container">
      <p>&copy; <span id="ano">2026</span> Luz Interior Terapias.</p> <!-- EDITAR -->
    </div>
  </footer>

  <script>
    // Ano atual no rodapé (script mínimo, a página não precisa do main.js)
    document.getElementById('ano').textContent = new Date().getFullYear();
  </script>
</body>
</html>
